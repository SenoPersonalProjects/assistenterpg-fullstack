version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: assistenterpg-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: assistenterpg
      MYSQL_USER: assistenterpg
      MYSQL_PASSWORD: assistenterpg_dev
      MYSQL_ROOT_PASSWORD: root_dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - assistenterpg_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot_dev']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  assistenterpg_mysql_data:
