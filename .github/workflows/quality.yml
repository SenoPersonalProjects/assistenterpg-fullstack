name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistenterpg-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assistenterpg-front/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistenterpg-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assistenterpg-back/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate:safe
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/assistenterpg
      - run: npm run lint:check
      - run: npm test -- --runInBand
      - run: npm run build
